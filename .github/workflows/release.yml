name: Release

# Modules are versioned and tagged independently (ADR-0003, NFR3):
#   core/v0.1.0            exporters/otlp/v0.1.0            cmd/crierd/v0.1.0
# The tag prefix selects which module is being released.
on:
  push:
    tags:
      - "core/v*"
      - "exporters/*/v*"
      - "receivers/*/v*"
      - "cmd/*/v*"
      # A tag pattern is a list someone forgets to extend, and the module it
      # forgets is one that cannot be released at all — silently. receivers/*
      # was missing until the M6 audit looked for it, and cmd/ named crierd
      # specifically until the sweep after it.
      #
      # `on.push.tags` accepts no expressions, so this cannot be derived from
      # the modules that exist. The ci.yml job `module-coverage` checks the
      # correspondence instead, and fails when a module matches nothing here.
      #
      # `*` does not match `/`, so exporters/otlp/integration — test-only,
      # never published — still cannot be tagged into a release by accident.

permissions:
  contents: read

# NFR2's two toolchain policies. Same names, same values, and the same meaning
# as in ci.yml — a release must not be built on a different toolchain from the
# one CI exercised. Change them together.
env:
  GO_VERSION: "1.24"
  GO_SUPPORTED_VERSION: "stable"

jobs:
  resolve:
    name: Resolve module from tag
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
      is_binary: ${{ steps.parse.outputs.is_binary }}
      toolchain: ${{ steps.parse.outputs.toolchain }}
    steps:
      - id: parse
        run: |
          tag='${{ github.ref_name }}'
          module="${tag%/v*}"
          version="v${tag##*/v}"
          echo "module=$module"   >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only cmd/ modules ship binaries; the rest are consumed as libraries.
          # That is the same distinction NFR2's two toolchain policies turn on,
          # so it decides both here rather than being restated somewhere else
          # and drifting: a binary is built on the supported toolchain because
          # that toolchain is the standard library shipped inside it; a library
          # is built at the floor it promises importers.
          case "$module" in
            cmd/*)
              echo "is_binary=true" >> "$GITHUB_OUTPUT"
              echo "toolchain=$GO_SUPPORTED_VERSION" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_binary=false" >> "$GITHUB_OUTPUT"
              echo "toolchain=$GO_VERSION" >> "$GITHUB_OUTPUT"
              ;;
          esac

  verify:
    name: Verify ${{ needs.resolve.outputs.module }}
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # Full tag history (#53): the API-diff step below finds this module's
      # previous release by listing its own tags, which a shallow checkout
      # would not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.resolve.outputs.toolchain }}
          cache-dependency-path: ${{ needs.resolve.outputs.module }}/go.mod

      - name: Report the toolchain in use
        run: echo "${{ needs.resolve.outputs.module }} is verified with $(go version)"

      # A tag is immutable once anyone has fetched it. Everything that can fail
      # is checked before the release exists, never after.
      - name: Build, vet, test
        working-directory: ${{ needs.resolve.outputs.module }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      # Deliberately not the module's own toolchain. A library is verified at
      # its floor, and Go 1.24 is past its support window, so scanning there
      # reports standard-library findings no change to this repository can
      # resolve — and would block every library release on them.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_SUPPORTED_VERSION }}
          cache-dependency-path: ${{ needs.resolve.outputs.module }}/go.mod

      - name: govulncheck
        working-directory: ${{ needs.resolve.outputs.module }}
        run: |
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # NFR9: the changelog is generated from the real API diff, not written
      # from memory. A hand-written changelog documents what the author meant
      # to change; this documents what actually changed.
      #
      # -base is passed explicitly rather than left for gorelease to infer
      # (#53). Left to itself, gorelease asks the module proxy for this
      # module's latest published version — and once the proxy has indexed
      # the tag this workflow just pushed (a race this workflow does not
      # control), that answer is the release being published, so gorelease
      # diffs it against itself, finds nothing, and suggests a patch bump
      # inside its own release's notes. Reading the previous version from
      # this module's own tag history removes the race instead of hoping to
      # win it.
      - name: Generate API diff
        working-directory: ${{ needs.resolve.outputs.module }}
        run: |
          module='${{ needs.resolve.outputs.module }}'
          tag='${{ github.ref_name }}'

          # Newest first; git's version-aware ref sort handles the vX.Y.Z
          # suffix correctly since the module-path prefix is identical across
          # every tag being compared. Plain variables and head/sed rather than
          # a bash array, so this is the same on every shell that runs it.
          sorted=$(git tag --list "$module/v*" --sort=-v:refname)
          newest=$(printf '%s\n' "$sorted" | head -1)
          if [ "$newest" != "$tag" ]; then
            echo "::error::expected $tag to be the newest tag for $module, found '${newest:-<none>}' — checkout is missing tag history" >&2
            exit 1
          fi

          second=$(printf '%s\n' "$sorted" | sed -n '2p')
          if [ -n "$second" ]; then
            base="${second#"$module"/}"
          else
            # A real, documented gorelease outcome (-base=none), not a
            # message this workflow invents: there is no prior version to
            # diff against, and there will not be one for this module's first
            # release no matter how long the proxy takes to catch up.
            base="none"
          fi

          go install golang.org/x/exp/cmd/gorelease@latest
          set +e
          gorelease -base="$base" > "$RUNNER_TEMP/apidiff.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/apidiff.txt"
          if [ "$status" -ne 0 ]; then
            echo "::error::gorelease exited $status comparing against $base — see the output above" >&2
            exit "$status"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: apidiff
          path: ${{ runner.temp }}/apidiff.txt

  binaries:
    name: Build binaries
    needs: [resolve, verify]
    if: needs.resolve.outputs.is_binary == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.resolve.outputs.toolchain }}
          cache-dependency-path: ${{ needs.resolve.outputs.module }}/go.mod

      - name: Report the toolchain in use
        run: echo "${{ needs.resolve.outputs.module }} binaries are built with $(go version)"

      - name: Build
        working-directory: ${{ needs.resolve.outputs.module }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="crierd_${{ needs.resolve.outputs.version }}_${GOOS}_${GOARCH}"
          [ "$GOOS" = "windows" ] && name="${name}.exe"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.resolve.outputs.version }}" \
            -o "$RUNNER_TEMP/$name" .
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/crierd_*

  release:
    name: Publish release
    needs: [resolve, verify, binaries]
    # binaries is skipped for library modules; skipped must not block the release.
    if: always() && needs.verify.result == 'success' && needs.binaries.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Assemble release notes
        run: |
          diff_file="$RUNNER_TEMP/artifacts/apidiff/apidiff.txt"

          # A missing or empty artifact is a broken release, not a release
          # with no diff to report (#53): verify already failed a non-zero
          # gorelease, so the only way here is the upload step itself
          # failing, and substituting "(no API diff available)" let that pass
          # as a normal release with nobody the wiser. [ -s ] is true only
          # when the file exists and is non-empty, covering both "missing"
          # and "empty" in one check.
          if [ ! -s "$diff_file" ]; then
            echo "::error::$diff_file is missing or empty — the apidiff artifact upload must have failed" >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/notes.md"
          {
            printf '## %s %s\n\n' \
              '${{ needs.resolve.outputs.module }}' \
              '${{ needs.resolve.outputs.version }}'
            printf '### API changes\n\n```\n'
            cat "$diff_file"
            printf '```\n'
          } > "$notes"
          cat "$notes"

      - name: Verify the tag is signed
        run: |
          # NFR9. A release nobody can attribute is worth less than no release.
          #
          # #54: this used to warn and continue either way, which merged "not
          # signed" with "CI has no way to check" into one message that gated
          # nothing — every release published regardless. .github/allowed_signers
          # publishes the release key CI checks against, so a failure now means
          # something specific, and git verify-tag's own stderr (no longer
          # discarded) says which of the two it is.
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag '${{ github.ref_name }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find "$RUNNER_TEMP/artifacts" -type f -name 'crierd_*' \
            -exec cp {} "$RUNNER_TEMP"/ \; 2>/dev/null || true
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/crierd_*)
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --title '${{ needs.resolve.outputs.module }} ${{ needs.resolve.outputs.version }}' \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${assets[@]}"
