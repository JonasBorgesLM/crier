name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The floor the library modules promise (NFR2). Building and testing here is
  # what proves the promise holds — a module that quietly needs something newer
  # fails these jobs.
  GO_VERSION: "1.24"
  # NFR2's second policy: the toolchain command modules are built with, and the
  # one vulnerabilities are scanned against.
  #
  # This is not a floor in disguise. A library's floor says who may import it,
  # and consumers compile the code with their own toolchain — so core and the
  # exporters stay at GO_VERSION above. A binary is the opposite: nobody
  # imports it, and the toolchain that builds it is the standard library that
  # ships inside it, which makes it part of what is distributed.
  #
  # Scanning follows the same version for a related reason. Go 1.24 is past its
  # support window, so its final release carries standard-library
  # vulnerabilities whose fixes only ever shipped in later lines; scanning at
  # the floor reports findings no change here can resolve, and a check that
  # cannot go green stops being read.
  GO_SUPPORTED_VERSION: "stable"

jobs:
  # The repository is multi-module (ADR-0003), so a green root build does not
  # imply a green submodule build. Every job below fans out over the modules
  # rather than running once at the root.
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
      libraries: ${{ steps.find.outputs.libraries }}
      test_only: ${{ steps.find.outputs.test_only }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          modules=$(find . -name go.mod -not -path './.git/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          if [ "$modules" = "[]" ] || [ -z "$modules" ]; then
            # An empty matrix skips every job that fans out over it. ci-ok
            # would catch the skips, but failing here says what is wrong
            # instead of leaving someone to work it out from six skipped jobs.
            echo "::error::no modules discovered; every downstream job would be skipped"; exit 1
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered: $modules"

          # Library modules — the ones NFR2's first policy applies to, because
          # somebody may import them. Derived rather than listed: a hand-kept
          # list is a list someone forgets to extend, and the module it forgets
          # is the one that silently stops being checked.
          #
          # cmd/ is excluded by rule, not by name. NFR2 draws that line itself:
          # nobody imports a binary, so a command module is free to depend on
          # something the library floor could not carry.
          #
          # TEST_ONLY names modules that exist only to run tests and are never
          # published. Forgetting to add one here is loud — the module lands in
          # the guard and fails it — which is the right direction to fail in.
          TEST_ONLY='["exporters/otlp/integration"]'
          libraries=$(printf '%s' "$modules" | jq -c --argjson testonly "$TEST_ONLY" \
            '[ .[] | select(startswith("cmd/") | not) | select(. as $m | $testonly | index($m) | not) ]')
          echo "libraries=$libraries" >> "$GITHUB_OUTPUT"
          echo "Library modules: $libraries"

          echo "test_only=$TEST_ONLY" >> "$GITHUB_OUTPUT"
          echo "Test-only modules: $TEST_ONLY"

  test:
    name: test (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      # Which of NFR2's two policies this module falls under. Command modules
      # build on the supported toolchain because that toolchain is the standard
      # library shipped inside the binary; everything else builds at the floor
      # it promises importers, which is what proves the promise still holds.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ startsWith(matrix.module, 'cmd/') && env.GO_SUPPORTED_VERSION || env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Report the toolchain in use
        run: |
          echo "${{ matrix.module }} is built with $(go version)"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Verify formatting
        run: |
          # `gofmt -l` exits 0 with no output both when everything is formatted
          # and when it cannot read the tree, so its exit status is checked
          # separately from its output.
          if ! unformatted=$(gofmt -l .); then
            echo "::error::gofmt failed to run; formatting was not checked"; exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          if [ -f go.sum ]; then cp go.sum go.sum.bak; fi
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null; then
            echo "::error::go.mod is not tidy — run 'go mod tidy' in ${{ matrix.module }}"
            diff go.mod.bak go.mod || true
            exit 1
          fi

      - name: go test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  # NFR1: core must stay free of third-party runtime dependencies. Left to
  # review, this erodes one convenient import at a time.
  core-has-no-third-party-deps:
    name: core has no third-party deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.mod
      - name: Assert empty require block
        working-directory: core
        run: |
          # Resolved into a variable first so that `go list` failing aborts the
          # step. Piped straight into grep, a broken module would produce an
          # empty list and read as "no third-party dependencies" — a check that
          # passes because it did not run.
          all=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./...)
          if [ -z "$all" ]; then
            echo "::error::go list returned nothing; the check did not run"; exit 1
          fi
          deps=$(printf '%s\n' "$all" | grep -v '^github.com/JonasBorgesLM/crier/' || true)
          if [ -n "$deps" ]; then
            echo "::error::core gained third-party dependencies (NFR1):"
            echo "$deps"; exit 1
          fi
          echo "core depends only on the standard library."

  # The end-to-end suite runs crier against a real OpenTelemetry Collector in a
  # container (NFR6). It is behind a build tag, so the matrix job above runs
  # none of it — this is the job that actually exercises it.
  integration:
    name: integration (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Derived, not named. This job used to hardcode the one integration
        # module that exists; a second would have been skipped in silence,
        # which is the failure mode this repository keeps finding in
        # hand-kept lists.
        module: ${{ fromJSON(needs.discover.outputs.test_only) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: go test -tags=integration
        working-directory: ${{ matrix.module }}
        # The suite skips itself when there is no container runtime, which is
        # right for a developer without Docker and wrong here: a skipped suite
        # exits 0, so the job would go green having tested nothing against a
        # real collector. CI has Docker, so CI demands it.
        env:
          CRIER_REQUIRE_DOCKER: "1"
        run: go test -tags=integration -race -shuffle=on -timeout 20m ./...

  # ADR-0018: the OTLP exporter uses the slim proto module, because the
  # canonical one ships its gRPC service stubs in the same package as the
  # request message — so importing the message pulls in google.golang.org/grpc,
  # which declares go 1.25.0 and lifts a library module above the floor NFR2
  # asks it to promise.
  #
  # Both modules expose the same type names, so one changed import line reverts
  # that with nothing on screen to say why. A comment does not survive a
  # refactor; this does.
  no-grpc-in-libraries:
    name: library modules do not depend on gRPC
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Assert gRPC is absent from the module graph
        working-directory: ${{ matrix.module }}
        run: |
          # The module graph rather than the import list: a require line is
          # enough to constrain version selection and drag the floor up,
          # whether or not any package imports it yet.
          #
          # Resolved into a variable first so that a failure of `go mod graph`
          # itself aborts the step. Piped straight into grep, a broken module
          # would exit 1 for "no match" and read as a pass.
          graph=$(go mod graph)
          if edges=$(printf '%s\n' "$graph" | grep -F 'google.golang.org/grpc'); then
            echo "::error::${{ matrix.module }} depends on google.golang.org/grpc, which ADR-0018 forbids in a library module."
            echo "It declares go 1.25.0, so it raises this module above the Go 1.24 floor NFR2 promises to consumers."
            echo "If this came from switching go.opentelemetry.io/proto/slim/otlp to go.opentelemetry.io/proto/otlp,"
            echo "switch it back: the slim variant is the same generated types without the gRPC service stubs."
            echo "See docs/adr/0018-otlp-slim-module.md."
            echo "Offending edges:"
            echo "$edges"
            exit 1
          fi
          echo "${{ matrix.module }} has no gRPC in its module graph."

  # Two lists in this repository are hand-kept and cannot be derived: the
  # Dependabot directories and the release tag patterns, neither of which
  # accepts an expression. Each has already been found missing an entry once,
  # and each time the symptom was silence — an unwatched module, an
  # unreleasable one. The lists stay hand-kept; the omission does not stay
  # quiet.
  module-coverage:
    name: every module is watched and releasable
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Dependabot and release coverage
        run: |
          ./.github/scripts/module-coverage.py \
            '${{ needs.discover.outputs.modules }}' \
            '${{ needs.discover.outputs.test_only }}'

  lint:
    name: lint (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      # v8 is the line that runs golangci-lint v2 — v6 installs v1, which
      # rejects .golangci.yml's `version: "2"` schema outright.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Deliberately not GO_VERSION — see GO_SUPPORTED_VERSION above.
          go-version: ${{ env.GO_SUPPORTED_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # A single required check to protect the branch with, so adding a module
  # never silently widens the gap between "CI passed" and "everything ran".
  ci-ok:
    name: CI OK
    if: always()
    needs: [test, integration, lint, govulncheck, core-has-no-third-party-deps, no-grpc-in-libraries, module-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
