name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The floor NFR2 fixes. Building and testing here is what proves the floor
  # still holds — a module that quietly needs something newer fails these jobs.
  GO_VERSION: "1.24"
  # Go 1.24 is past its support window: its final release carries standard
  # library vulnerabilities whose fixes were only ever shipped in later lines.
  # Scanning at the floor therefore reports findings that no change to this
  # repository can resolve, and a check that cannot go green stops being read.
  # The vulnerability scan runs on a supported toolchain instead; the floor is
  # still what consumers may build with, and the gap between the two is the
  # subject of issue #44.
  GO_SCAN_VERSION: "stable"

jobs:
  # The repository is multi-module (ADR-0003), so a green root build does not
  # imply a green submodule build. Every job below fans out over the modules
  # rather than running once at the root.
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          modules=$(find . -name go.mod -not -path './.git/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered: $modules"

  test:
    name: test (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          if [ -f go.sum ]; then cp go.sum go.sum.bak; fi
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null; then
            echo "::error::go.mod is not tidy — run 'go mod tidy' in ${{ matrix.module }}"
            diff go.mod.bak go.mod || true
            exit 1
          fi

      - name: go test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  # NFR1: core must stay free of third-party runtime dependencies. Left to
  # review, this erodes one convenient import at a time.
  core-has-no-third-party-deps:
    name: core has no third-party deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.mod
      - name: Assert empty require block
        working-directory: core
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
                 | grep -v '^github.com/JonasBorgesLM/crier/' || true)
          if [ -n "$deps" ]; then
            echo "::error::core gained third-party dependencies (NFR1):"
            echo "$deps"; exit 1
          fi
          echo "core depends only on the standard library."

  # The end-to-end suite runs crier against a real OpenTelemetry Collector in a
  # container (NFR6). It is behind a build tag, so the matrix job above runs
  # none of it — this is the job that actually exercises it.
  integration:
    name: integration (otlp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: exporters/otlp/integration/go.mod
      - name: go test -tags=integration
        working-directory: exporters/otlp/integration
        run: go test -tags=integration -race -shuffle=on -timeout 20m ./...

  lint:
    name: lint (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      # v8 is the line that runs golangci-lint v2 — v6 installs v1, which
      # rejects .golangci.yml's `version: "2"` schema outright.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Deliberately not GO_VERSION — see the comment on GO_SCAN_VERSION.
          go-version: ${{ env.GO_SCAN_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # A single required check to protect the branch with, so adding a module
  # never silently widens the gap between "CI passed" and "everything ran".
  ci-ok:
    name: CI OK
    if: always()
    needs: [test, integration, lint, govulncheck, core-has-no-third-party-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
