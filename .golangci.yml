# Strict by intent (NFR6). crier is a security-adjacent component: an
# unchecked error on a redaction or admission path is a real defect, not lint
# noise.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupl
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - goconst
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      ignore-tests: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]
    govet:
      enable-all: true
      disable: [fieldalignment]
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments

  exclusions:
    rules:
      # Table-driven tests are repetitive by nature, and a test that ignores a
      # cleanup error is not the risk this config exists to catch.
      - path: _test\.go$
        linters: [dupl, errcheck, gosec, goconst, unparam]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/JonasBorgesLM/crier]
